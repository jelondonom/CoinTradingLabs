packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests'

# Únicas dependencias autorizadas a ejecutar scripts de instalación.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true

# Versiones forzadas en dependencias transitivas, solo por parches de seguridad.
# Quitar cada una cuando la dependencia que la trae ya pida una versión corregida.
overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS, alta). Llega por prisma → @prisma/config, que pide 3.20.0.
  # Solo para @prisma/config y solo parches de 3.22: si el lockfile cambia de versión, correr
  # `prisma validate`.
  '@prisma/config>effect': ~3.22.1
